[project]
name = "data-project-f1"
version = "0.1.0"
description = "F1 Data Analysis Dashboard"
readme = "README.md"
authors = [
    { name = "Ayan Sarkar", email = "ayan.sarkar@edu.esiee.fr" },
    { name = "Antoine Palliser", email = "antoine.palliser@edu.esiee.fr" },
]
requires-python = ">=3.11"
dependencies = [
    "dash>=4.4.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.17.2",
    "types-requests>=2.33.0.20261006",
]

[tool.pylint.basic]
good-names = ["df", "i", "j", "_"]

[tool.pylint.format]
max-line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
